<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>  
    <div class="bg-image">
        <img src="images/tim-mossholder-ShmRLyRv-S0-unsplash.jpg" alt="">
    </div>
    <div class = form-body>
        <div class="form-header" >
        <p>Welcome to Faraday's electric Supplies.
             — proudly serving customers since our founding in 1988.</p> </p>
         <br>
        <p><em>Sign up to get started</em></p>
        </div>
        <form action="">
            <div class="contact">
                <fieldset>
                    <legend>Fill out this short form</legend>
                    <p>
                        <label for="fname">FIRST NAME</label>
                        <input type="text" id="fname" name="user-name">
                    </p>
                    <p>
                        <label for="email">EMAIL</label>
                        <input type="email" name="user-email" id="email">
                    </p>
                    <p>
                        <label for="pss">PASSWORD</label>
                        <input type="password" id="pss" name="user-password">
                    </p>
                    <p>
                        <label for="lname">LASTNAME</label>
                        <input type="text" id="lname" name="user-name">
                    </p>
                    <p>
                        <label for="pnumber">PHONE NUMBER</label>
                        <input type="text" id="pnumber" name="user-phone-number" pattern="[0-9+]">
                    </p>
                    <p>
                        <label for="cpss">CONFIRM PASSWORD</label>
                        <input type="password" id="cpss" name="password-confirm">
                    </p>
                </fieldset>
            </div>

        </form>
    </div>
</body>
</html>
